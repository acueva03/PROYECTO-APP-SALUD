name: CI
on: [push, pull_request]

jobs:
  tests-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt coverage
      - name: unittest con cobertura
        working-directory: backend
        env:
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          coverage run --source=. --omit='tests/*,seed.py' -m unittest discover -v
          coverage report -m --fail-under=60

  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx eslint frontend/static

  # Despliegue automático en Render: solo al subir a main y solo si los tests y ESLint pasan.
  # Necesita el secreto RENDER_DEPLOY_HOOK (GitHub: Settings > Secrets and variables > Actions),
  # que es la "Deploy Hook URL" de Render (servicio app-salud > Settings). Si falta, no falla: solo avisa.
  deploy:
    needs: [tests-python, eslint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Avisar a Render para que despliegue
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -e
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Falta el secreto RENDER_DEPLOY_HOOK: no se despliega (hay que configurarlo en GitHub)."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Render ha recibido el aviso de despliegue."
