name: CI
on: [push, pull_request]

jobs:
  tests-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt coverage
      - name: unittest con cobertura
        working-directory: backend
        env:
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          coverage run --source=. --omit='test_*.py,base_tests.py,seed.py' -m unittest discover -v
          coverage report -m --fail-under=60

  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx eslint frontend/static